<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620">
  <style>
    .box { fill: #e8f1fb; stroke: #2c5aa0; stroke-width: 1.5; }
    .green { fill: #e5f6e8; stroke: #2e7d32; }
    .gray { fill: #f4f4f4; stroke: #888; }
    .text { font-family: system-ui, sans-serif; font-size: 13px; fill: #1a1a1a; }
    .title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; }
    .arrow { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <text x="320" y="28" text-anchor="middle" class="title">Processing Pipeline</text>
  <rect class="box" x="120" y="45" width="400" height="36"/><text x="320" y="67" text-anchor="middle" class="text">1. Load image, keep I_0</text>
  <rect class="gray" x="120" y="100" width="400" height="36"/><text x="320" y="122" text-anchor="middle" class="text">2. Optional T on both copies</text>
  <rect class="box" x="120" y="155" width="400" height="36"/><text x="320" y="177" text-anchor="middle" class="text">3. Estimate artwork region R-hat</text>
  <rect class="box" x="120" y="210" width="400" height="36"/><text x="320" y="232" text-anchor="middle" class="text">4. OCR to boxes (b_i, s_i, c_i)</text>
  <rect class="box" x="120" y="265" width="400" height="48"/><text x="320" y="293" text-anchor="middle" class="text">5. Filter: center in R-hat, low conf, small, CJK, watermark</text>
  <rect class="box" x="120" y="332" width="400" height="36"/><text x="320" y="354" text-anchor="middle" class="text">6. Translate (lexicon then Qwen)</text>
  <rect class="box" x="120" y="387" width="400" height="36"/><text x="320" y="409" text-anchor="middle" class="text">7. Render Chinese, adaptive size</text>
  <rect class="green" x="120" y="442" width="400" height="36"/><text x="320" y="464" text-anchor="middle" class="text">8. Copy original pixels of R-hat</text>
  <rect class="box" x="120" y="497" width="400" height="36"/><text x="320" y="519" text-anchor="middle" class="text">9. PSNR on R-hat (target infinity)</text>
  <line class="arrow" x1="320" y1="81" x2="320" y2="100"/>
  <line class="arrow" x1="320" y1="136" x2="320" y2="155"/>
  <line class="arrow" x1="320" y1="191" x2="320" y2="210"/>
  <line class="arrow" x1="320" y1="246" x2="320" y2="265"/>
  <line class="arrow" x1="320" y1="313" x2="320" y2="332"/>
  <line class="arrow" x1="320" y1="368" x2="320" y2="387"/>
  <line class="arrow" x1="320" y1="423" x2="320" y2="442"/>
  <line class="arrow" x1="320" y1="478" x2="320" y2="497"/>
</svg>
