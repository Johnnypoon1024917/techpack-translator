<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <style>
    .box { fill: #e8f1fb; stroke: #2c5aa0; stroke-width: 1.5; }
    .green { fill: #e5f6e8; stroke: #2e7d32; }
