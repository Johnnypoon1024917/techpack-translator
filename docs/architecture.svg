  <rect class="box" x="520" y="220" width="200" height="36"/><text x="620" y="242" text-anchor="middle" class="text">OCR</text>
  <rect class="box" x="520" y="270" width="200" height="36"/><text x="620" y="292" text-anchor="middle" class="text">Filter boxes</text>
  <rect class="box" x="520" y="320" width="200" height="36"/><text x="620" y="342" text-anchor="middle" class="text">Translate (lexicon / Qwen)</text>
