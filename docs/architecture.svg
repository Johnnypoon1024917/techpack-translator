  </defs>
  <text x="450" y="28" text-anchor="middle" class="title">Tech Pack Translation Architecture</text>
  <text x="180" y="58" text-anchor="middle" class="text">I_0 (Preserved Original)</text>
  <text x="620" y="58" text-anchor="middle" class="text">I_w (Working Copy)</text>
  <rect class="box" x="80" y="70" width="200" height="36"/><text x="180" y="92" text-anchor="middle" class="text">Input Image</text>
  <rect class="box" x="80" y="130" width="200" height="36"/><text x="180" y="152" text-anchor="middle" class="text">Shared transform T</text>
